services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/init/001_create_databases.sql:/docker-entrypoint-initdb.d/001_create_databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
