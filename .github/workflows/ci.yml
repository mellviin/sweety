name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Start and provision PostgreSQL
        run: |
          postgres_password="$(openssl rand -hex 32)"
          app_password="$(openssl rand -hex 32)"
          migrate_password="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          echo "::add-mask::$app_password"
          echo "::add-mask::$migrate_password"
          docker run --detach \
            --name sweety-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD="$postgres_password" \
            --env APP_DB_PASSWORD="$app_password" \
            --env MIGRATE_DB_PASSWORD="$migrate_password" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/server/src/db/init/001_create_databases.sql,target=/docker-entrypoint-initdb.d/001_create_databases.sql,readonly" \
            postgres:16
          ready=0
          for attempt in $(seq 1 60); do
            if docker logs sweety-ci-postgres 2>&1 | grep -q "PostgreSQL init process complete"; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          {
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "APP_DB_PASSWORD=$app_password"
            echo "MIGRATE_DB_PASSWORD=$migrate_password"
            echo "DATABASE_URL=postgresql://sweety_app:$app_password@localhost:5432/sweety"
            echo "MIGRATION_DATABASE_URL=postgresql://sweety_migrate:$migrate_password@localhost:5432/sweety"
            echo "TEST_DATABASE_URL=postgresql://sweety_app:$app_password@localhost:5432/sweety_test"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Apply database migrations
        working-directory: server
        run: npm run migrate

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Test server
        working-directory: server
        run: npm test

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Test client
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  audit-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Audit server dependencies
        working-directory: server
        run: npm audit --audit-level=high

  audit-client:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Audit client dependencies
        working-directory: client
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --redact --no-banner

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
