name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sweety
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sweety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sweety
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sweety_test
      JWT_SECRET: ci-only-signing-key-not-for-production
      NODE_ENV: development
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql \
            --host localhost \
            --username postgres \
            --dbname postgres \
            --command "CREATE DATABASE sweety_test;"

      - name: Apply database migrations
        working-directory: server
        run: npm run migrate

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Test server
        working-directory: server
        run: npm test

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Test client
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build
